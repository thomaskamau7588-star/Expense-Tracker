<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header -->
    <header>
        <h1>Expense Tracker</h1>
        <p>Manage your daily expenses easily.</p>
    </header>
    <main>
        <!-- Add Expense Form -->
        <section class="expense-form">

            <h2>Add New Expense</h2>

            <form id="expense-form">

                <label for="description">Description</label>
                <input type="text" id="description" placeholder="Enter expense description" required>

                <label for="amount">Amount (KSh)</label>
                <input type="number" id="amount" placeholder="Enter amount" min="0.01" step="0.01" required>

                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Add Expense</button>

            </form>
        </section>

        <!-- Expense List -->
        <section class="expense-list">

            <h2>My Expenses</h2>

            <label for="filter-category">Filter by Category</label>

            <select id="filter-category">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>

            <ul id="expense-list">
            </ul>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Expense Tracker. All rights reserved.</p>
    </footer>

</body>

</html>
